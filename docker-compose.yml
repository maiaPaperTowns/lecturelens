services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lenslab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lenslab}
      POSTGRES_DB: ${POSTGRES_DB:-lecturelens}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lenslab} -d ${POSTGRES_DB:-lecturelens}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-lenslab}:${POSTGRES_PASSWORD:-lenslab}@db:5432/${POSTGRES_DB:-lecturelens}
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MODELS_DIR: /models
      UPLOAD_DIR: /data/uploads
      CORS_ORIGINS: "http://localhost:3000,http://localhost:5173"
    volumes:
      - models:/models
      - uploads:/data/uploads
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:
  models:
  uploads:
