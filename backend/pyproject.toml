[project]
name = "lecturelens-backend"
version = "0.1.0"
description = "LectureLens backend - FastAPI + PyTorch + scikit-learn study-map pipeline"
requires-python = ">=3.11"

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["app", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]
ignore = ["B008"]  # FastAPI Depends() in defaults

[tool.ruff.lint.isort]
known-first-party = ["app", "scripts"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"scripts/*" = ["E402"]  # sys.path bootstrap must precede imports
"alembic/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-warnings"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
plugins = []
